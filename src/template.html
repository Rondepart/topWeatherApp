<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <div class="header-start">
          <h1 class="header-title">Bophytus</h1>
          <p>Check weather around the globe</p>
        </div>
        <div class="header-center">
          <form id="weather-form" novalidate>
            <label for="location">Enter Location:</label>
            <div class="search-field">
              <input
                type="text"
                id="location"
                class="location"
                minlength="2"
                maxlength="100"
                placeholder="City or Country"
                required
              />
              <button type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 19 19"><title>Search</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
              </button>
            </div>
            <div class="location-error"></div>
            
          </form>
        </div>
        <div class="header-end">
          <div class="toggle-container">
            <label for="toggle-unit" class="toggle-indicator">Toggle Unit: °C</label>
            <button type="button" id="toggle-unit" class="toggle-unit">Switch</button>
          </div>
        </div>
      </header>
      <main class="weather-container">
        <section class="weather-today" hidden>
          <article class="current-condition-container">
            <div class="current-condition-card">
              <div class="current-condition-info">
                <h3 class="resolved-location"></h3>
                <div class="current-temp"></div>
                <div class="current-feelslike-temp"></div>
                <div class="current-condition"></div>
              </div>
              <div class="current-condition-icon">
                <div class="current-weather-icon"></div>
              </div>
            </div>
          </article>
          <article class="hourly-weather-today">
            <h3 class="hourly-weather-header">Hourly weather today</h3>
            <div class="hourly-weather-cards"></div>
          </article>
        </section>
        <section class="weather-history" hidden>
          <article class="weather-history-container">
            <h3 class="weather-history-header">Weather History</h3>
            <div class="weather-history-cards"></div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
