<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <form id="weather-form">
      <label for="location">
        <span>Enter Location:</span>
        <input
          type="text"
          id="location"
          class="location"
          minlength="2"
          maxlength="100"
          placeholder="City or Country"
          required
        />
      </label>
      <button type="submit">Search</button>
    </form>
  </body>
</html>
