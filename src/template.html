<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="layout">
      <header>
        <form id="weather-form" novalidate>
          <label for="location">
            <span>Enter Location:</span>
            <input
              type="text"
              id="location"
              class="location"
              minlength="2"
              maxlength="100"
              placeholder="City or Country"
              required
            />
          </label>
          <div class="location-error"></div>
          <button type="submit">Search</button>
        </form>
      </header>
      <main class="weather-container">
        <section class="weather-today" hidden> 
          <article class="current-condition-container">
            <h3 class="resolved-location"></h3>
            <div class="current-temp"></div>
            <div class="current-feelslike-temp"></div>
            <div class="current-condition"></div>
            <div class="current-weather-icon"></div>
          </article>
          <article class="hourly-weather-today">
            <h3 class="hourly-weather-header">Hourly weather today</h3>
            <div class="hourly-weather-cards"></div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
